name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "pycares<5"
          pip install pytest pytest-asyncio "ruff==0.17.2" "basedpyright==1.39.2"
          pip install -e .
          # HA runtime pro testy (minimální) spolu s testovacím pluginem, který si
          # pinuje přesnou verzi HA. Instalace v jednom kroku zaručí, že výsledné HA
          # je opravdu 2026.2.3; nesoulad pinů skončí chybou resolveru.
          pip install homeassistant==2026.2.3 pytest-homeassistant-custom-component==0.13.316
          # Knihovnu instalovat pod stejnými piny, pod jakými ji instaluje HA
          # (homeassistant/package_constraints.txt). CI tak odhalí požadavek,
          # který na minimální podporované verzi HA nejde nainstalovat.
          export PIP_CONSTRAINT="$(python -c 'import homeassistant, os; print(os.path.join(os.path.dirname(homeassistant.__file__), "package_constraints.txt"))')"
          pip install async-bakalari-api==0.10.5
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (format)
        run: ruff format --check .
      - name: basedpyright
        run: basedpyright
      - name: Tests
        run: pytest -q
